# Nginx reverse proxy for qlip-api.techfamz.com -> Fastify (PM2 "qlip-api", 127.0.0.1:4477)
#
# Install on the VPS:
#   sudo cp deploy/nginx-qlip-api.conf /etc/nginx/sites-available/qlip-api.techfamz.com
#   sudo ln -s /etc/nginx/sites-available/qlip-api.techfamz.com /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then run certbot (see README) — it will rewrite the server block below to
# add the SSL directives and an HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name qlip-api.techfamz.com;

    # Large-ish body allowance in case future endpoints accept uploads;
    # downloads/extracts themselves don't need this but it's harmless.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4477;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video streaming can run long and shouldn't be buffered into memory
        # by nginx before forwarding — pass bytes straight through.
        proxy_buffering off;
        proxy_request_buffering off;

        # Large/slow downloads (bigger videos, slow source sites) need more
        # headroom than nginx's 60s default or the connection gets cut.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
